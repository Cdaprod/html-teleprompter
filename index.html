<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davids Teleprompter</title>
    <style>
        :root {
            --bg: #050505;
            --panel: rgba(20, 20, 20, 0.85);
            --border: #303030;
            --accent: #46c2ff;
            --text: #f6f6f6;
            --muted: #b0b0b0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Inter", system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 20% 20%, rgba(70, 194, 255, 0.08), transparent 35%),
                        radial-gradient(circle at 80% 0%, rgba(255, 122, 0, 0.08), transparent 30%),
                        var(--bg);
            color: var(--text);
            overflow-x: hidden;
            min-height: 100vh;
        }

        #videoBackground {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s;
            filter: saturate(1.1) brightness(0.7);
        }

        #videoBackground.active {
            opacity: 0.75;
        }

        .controls {
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
            background: var(--panel);
            padding: 14px 18px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 10px 14px;
            align-items: center;
            border-bottom: 1px solid var(--border);
            z-index: 100;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            backdrop-filter: blur(14px) saturate(130%);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .controls.hidden {
            transform: translateY(-100%);
            box-shadow: none;
            height: 0;
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            border-bottom: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .control-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .control-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
        }

        select, button, input[type="text"], input[type="number"] {
            background: #161616;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.12s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            white-space: nowrap;
        }

        select:hover, button:hover, input[type="text"]:focus, input[type="number"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(70, 194, 255, 0.15);
        }

        button:active {
            transform: translateY(1px);
        }

        #fileSelect {
            min-width: 200px;
            max-width: 360px;
            flex: 1;
        }

        .ghost-btn {
            background: transparent;
            color: var(--muted);
            border-style: dashed;
        }

        #toggleControlsBtn {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 101;
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0.9;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        #toggleControlsBtn:hover {
            opacity: 1;
            border-color: var(--accent);
        }

        .collapsed-controls {
            position: fixed;
            right: 14px;
            top: 64px;
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 10px 12px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(12px) saturate(120%);
            opacity: 0;
            pointer-events: none;
            transform: translateY(-10px);
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 102;
        }

        .collapsed-controls.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .collapsed-controls .label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
        }

        @media (max-width: 768px) {
            .controls {
                padding: 12px;
            }

            #toggleControlsBtn {
                top: 10px;
                right: 10px;
            }
        }

        main {
            padding: 32px 24px 80px;
        }

        .content {
            margin-top: 32px;
            white-space: pre-wrap;
            font-size: 26px;
            line-height: 1.55;
            padding: 28px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
            transition: margin-top 0.3s ease, max-width 0.3s ease;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.85);
            position: relative;
            z-index: 1;
            border-radius: 16px;
            background: linear-gradient(145deg, rgba(20, 20, 20, 0.95), rgba(15, 15, 15, 0.8));
            border: 1px solid var(--border);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .content.controls-hidden {
            margin-top: 20px;
        }

        .mirror {
            transform: scaleX(-1);
        }

        .split-view {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            max-width: 1800px;
        }

        .speed-control {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .input-stack {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .range-stack {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            width: 100%;
        }

        .range-control {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .range-control label {
            font-size: 12px;
            color: var(--muted);
        }

        .range-control input[type="range"] {
            accent-color: var(--accent);
        }

        #uploadInput {
            display: none;
        }

        .status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #161616;
            padding: 12px 18px;
            border-radius: 12px;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            border: 1px solid var(--border);
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.45);
            transform: translateY(20px);
        }

        .status.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <video id="videoBackground" autoplay muted playsinline></video>

    <button id="toggleControlsBtn">Hide Controls</button>

    <div id="collapsedControls" class="collapsed-controls" aria-hidden="true">
        <span class="label">Quick control</span>
        <button id="collapsedPlayBtn">Play</button>
    </div>

    <main>
        <div class="controls" id="controls">
            <div class="control-group">
                <div class="input-stack" style="flex: 1; min-width: 260px;">
                    <span class="control-title">Video background</span>
                    <div class="control-group">
                        <button id="cameraBtn">Use Camera</button>
                        <input type="text" id="videoUrl" placeholder="Stream URL (http://192.168.1.100:8080/video)" style="flex: 1; min-width: 180px;">
                        <button id="loadVideoBtn">Load Stream</button>
                        <button id="stopVideoBtn" class="ghost-btn">Stop</button>
                    </div>
                </div>
            </div>

            <div class="control-group" style="grid-column: span 2;">
                <div class="input-stack" style="width: 100%;">
                    <span class="control-title">Transcript library (docs/ and uploads)</span>
                    <div class="control-group" style="width: 100%;">
                        <select id="fileSelect">
                            <option value="">Select transcript or upload...</option>
                        </select>
                        <input type="file" id="uploadInput" accept=".md,.txt" multiple>
                        <button id="uploadBtn">Upload File</button>
                        <button id="saveStorageBtn">Save All</button>
                        <button id="loadStorageBtn">Load Saved</button>
                    </div>
                    <div class="control-group" style="width: 100%;">
                        <input type="text" id="docsFileName" placeholder="docs filename (e.g. demo-list.txt)" style="flex: 1; min-width: 180px;">
                        <button id="addDocBtn">Add from docs/</button>
                        <button id="refreshDocsBtn" class="ghost-btn">Refresh docs/ list</button>
                    </div>
                </div>
            </div>

            <div class="control-group" style="flex-wrap: nowrap; gap: 10px;">
                <button id="playBtn">Play</button>
                <button id="mirrorBtn">Mirror</button>
                <button id="splitBtn">Split View</button>
                <div class="speed-control">
                    <button id="decreaseSpeed">-</button>
                    <span id="speedDisplay">1.0x</span>
                    <button id="increaseSpeed">+</button>
                </div>
            </div>

            <div class="range-stack" style="grid-column: span 2;">
                <div class="range-control">
                    <label for="fontSizeControl">Font size (<span id="fontSizeValue">26</span>px)</label>
                    <input id="fontSizeControl" type="range" min="16" max="60" value="26">
                </div>
                <div class="range-control">
                    <label for="lineHeightControl">Line height (<span id="lineHeightValue">1.55</span>)</label>
                    <input id="lineHeightControl" type="range" min="1.2" max="2.2" step="0.05" value="1.55">
                </div>
                <div class="range-control">
                    <label for="widthControl">Max width (<span id="widthValue">900</span>px)</label>
                    <input id="widthControl" type="range" min="500" max="1400" step="50" value="900">
                </div>
            </div>
        </div>

        <div id="contentWrapper">
            <div id="content" class="content"></div>
        </div>
    </main>

    <div id="status" class="status"></div>

    <script>
        class Teleprompter {
            constructor() {
                this.DEFAULT_DOC_NAME = 'demo-list.txt';
                this.DEFAULT_DOC_CONTENT = `Welcome to the teleprompter demo.\n\n- Use the Transcript library dropdown to switch between scripts.\n- Upload .txt or .md files to add your own text.\n- Type a docs/ filename and press "Add from docs/" if your manifest is missing.\n- Try mirror or split view when projecting.\n\nUse the play controls below to begin.`;

                this.content = document.getElementById('content');
                this.contentWrapper = document.getElementById('contentWrapper');
                this.fileSelect = document.getElementById('fileSelect');
                this.uploadInput = document.getElementById('uploadInput');
                this.docsFileName = document.getElementById('docsFileName');
                this.speedDisplay = document.getElementById('speedDisplay');
                this.status = document.getElementById('status');
                this.controls = document.getElementById('controls');
                this.toggleControlsBtn = document.getElementById('toggleControlsBtn');
                this.collapsedControls = document.getElementById('collapsedControls');
                this.collapsedPlayBtn = document.getElementById('collapsedPlayBtn');
                this.videoBackground = document.getElementById('videoBackground');
                this.videoUrl = document.getElementById('videoUrl');
                this.fontSizeControl = document.getElementById('fontSizeControl');
                this.lineHeightControl = document.getElementById('lineHeightControl');
                this.widthControl = document.getElementById('widthControl');

                this.files = new Map();
                this.speed = 1.0;
                this.isPlaying = false;
                this.isMirrored = false;
                this.isSplit = false;
                this.controlsVisible = true;
                this.scrollRaf = null;
                this.mediaStream = null;

                this.initializeControls();
                this.restorePreferences();
                this.loadSavedTranscripts();
                this.loadDocs();
            }

            initializeControls() {
                this.toggleControlsBtn.addEventListener('click', () => this.toggleControls());
                this.collapsedPlayBtn.addEventListener('click', () => this.togglePlay());

                document.getElementById('cameraBtn').addEventListener('click', () => this.useCamera());
                document.getElementById('loadVideoBtn').addEventListener('click', () => this.loadVideo());
                document.getElementById('stopVideoBtn').addEventListener('click', () => this.stopVideo());

                document.getElementById('uploadBtn').addEventListener('click', () => {
                    this.uploadInput.click();
                });

                this.uploadInput.addEventListener('change', (e) => {
                    Array.from(e.target.files).forEach(file => this.handleFileUpload(file));
                    this.uploadInput.value = '';
                });

                document.getElementById('saveStorageBtn').addEventListener('click', () => {
                    this.saveTranscripts();
                });

                document.getElementById('loadStorageBtn').addEventListener('click', () => {
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = '.json';
                    input.onchange = (e) => this.loadTranscriptsFile(e.target.files[0]);
                    input.click();
                });

                document.getElementById('addDocBtn').addEventListener('click', () => this.loadDocByName());
                document.getElementById('refreshDocsBtn').addEventListener('click', () => this.loadDocs(true));

                this.fileSelect.addEventListener('change', () => {
                    const content = this.files.get(this.fileSelect.value);
                    if (content) {
                        this.setContent(content);
                        this.updateSplitView();
                    }
                });

                document.getElementById('playBtn').addEventListener('click', () => this.togglePlay());
                document.getElementById('mirrorBtn').addEventListener('click', () => this.toggleMirror());
                document.getElementById('splitBtn').addEventListener('click', () => this.toggleSplit());
                document.getElementById('decreaseSpeed').addEventListener('click', () => this.adjustSpeed(-0.1));
                document.getElementById('increaseSpeed').addEventListener('click', () => this.adjustSpeed(0.1));

                this.fontSizeControl.addEventListener('input', () => this.updateAppearance());
                this.lineHeightControl.addEventListener('input', () => this.updateAppearance());
                this.widthControl.addEventListener('input', () => this.updateAppearance());

                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        this.togglePlay();
                    } else if (e.code === 'ArrowUp') {
                        this.adjustSpeed(0.1);
                    } else if (e.code === 'ArrowDown') {
                        this.adjustSpeed(-0.1);
                    } else if (e.code === 'KeyH' || e.code === 'Escape') {
                        this.toggleControls();
                    }
                });
            }

            toggleControls() {
                this.controlsVisible = !this.controlsVisible;
                this.controls.classList.toggle('hidden', !this.controlsVisible);
                this.content.classList.toggle('controls-hidden', !this.controlsVisible);
                this.toggleControlsBtn.textContent = this.controlsVisible ? 'Hide Controls' : 'Show Controls';
                this.collapsedControls.classList.toggle('visible', !this.controlsVisible);
                this.collapsedControls.setAttribute('aria-hidden', this.controlsVisible ? 'true' : 'false');

                const mirrorContent = document.getElementById('content-mirror');
                if (mirrorContent) {
                    mirrorContent.classList.toggle('controls-hidden', !this.controlsVisible);
                }
            }

            async useCamera() {
                try {
                    this.stopVideo();
                    this.mediaStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'user' },
                        audio: false
                    });

                    this.videoBackground.srcObject = this.mediaStream;
                    this.videoBackground.classList.add('active');
                    this.showStatus('Camera activated', 3000);
                } catch (err) {
                    this.showStatus('Error accessing camera: ' + err.message, 5000);
                    console.error('Camera access error:', err);
                }
            }

            loadVideo() {
                const url = this.videoUrl.value.trim();
                if (!url) {
                    this.showStatus('Please enter a video stream URL', 3000);
                    return;
                }

                if (this.mediaStream) {
                    this.mediaStream.getTracks().forEach(track => track.stop());
                    this.mediaStream = null;
                }

                this.videoBackground.srcObject = null;
                this.videoBackground.src = url;
                this.videoBackground.classList.add('active');
                this.videoBackground.play().then(() => {
                    this.showStatus('Video stream loaded', 3000);
                }).catch(err => {
                    this.showStatus('Error loading video stream: ' + err.message, 5000);
                    console.error('Video load error:', err);
                });
            }

            stopVideo() {
                if (this.mediaStream) {
                    this.mediaStream.getTracks().forEach(track => track.stop());
                    this.mediaStream = null;
                }

                this.videoBackground.pause();
                this.videoBackground.srcObject = null;
                this.videoBackground.src = '';
                this.videoBackground.classList.remove('active');
                this.showStatus('Video stopped', 3000);
            }

            async loadDocs(forceReload = false) {
                if (!forceReload && this.loadedDocsOnce) return;

                let loadedCount = 0;

                try {
                    const response = await fetch('docs/list.json', { cache: 'no-cache' });
                    if (response.ok) {
                        const docFiles = await response.json();

                        for (const fileName of docFiles) {
                            if (!fileName.endsWith('.txt') && !fileName.endsWith('.md')) continue;
                            const didLoad = await this.loadDocFile(fileName, { silent: true });
                            if (didLoad) loadedCount++;
                        }
                    } else {
                        this.showStatus('docs/list.json missing. Add docs/ files or refresh.', 4000);
                    }
                } catch (err) {
                    console.warn('Error loading docs/list.json', err);
                    this.showStatus('Could not read docs/list.json. Use "Add from docs/" to pull a file.', 4500);
                }

                if (loadedCount === 0) {
                    await this.ensureDefaultTranscript();
                }

                if (loadedCount > 0) {
                    this.showStatus(`Loaded ${loadedCount} transcript(s) from docs/`, 3000);
                    this.loadedDocsOnce = true;
                }
            }

            async loadDocFile(fileName, { silent = false } = {}) {
                try {
                    const fileUrl = `docs/${fileName}`;
                    const response = await fetch(fileUrl, { cache: 'no-cache' });
                    if (!response.ok) {
                        throw new Error(`Missing ${fileUrl}`);
                    }
                    const content = await response.text();
                    this.addTranscript(fileName, content, false);
                    return true;
                } catch (err) {
                    if (!silent) {
                        this.showStatus(err.message, 4000);
                        console.error(err);
                    }
                    return false;
                }
            }

            async ensureDefaultTranscript() {
                const loaded = await this.loadDocFile(this.DEFAULT_DOC_NAME, { silent: true });
                if (loaded) {
                    this.fileSelect.value = this.DEFAULT_DOC_NAME;
                    this.setContent(this.files.get(this.DEFAULT_DOC_NAME));
                    this.updateSplitView();
                    this.loadedDocsOnce = true;
                    this.showStatus(`Loaded fallback docs/${this.DEFAULT_DOC_NAME}`);
                    return;
                }

                if (!this.files.has(this.DEFAULT_DOC_NAME)) {
                    this.addTranscript(this.DEFAULT_DOC_NAME, this.DEFAULT_DOC_CONTENT, true);
                    this.showStatus('Added built-in demo transcript');
                }
            }

            async loadDocByName() {
                const fileName = this.docsFileName.value.trim();
                if (!fileName) {
                    this.showStatus('Enter a filename in docs/ (e.g. demo-list.txt)', 3000);
                    return;
                }

                const didLoad = await this.loadDocFile(fileName);
                if (didLoad) {
                    this.fileSelect.value = fileName;
                    this.setContent(this.files.get(fileName));
                    this.updateSplitView();
                    this.showStatus(`Loaded docs/${fileName}`);
                }
            }

            handleFileUpload(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const fileName = file.name;
                    const content = e.target.result;
                    this.addTranscript(fileName, content, true);
                    this.showStatus(`Uploaded ${fileName}`);
                };
                reader.readAsText(file);
            }

            addTranscript(fileName, content, selectAfter = false) {
                this.files.set(fileName, content);

                if (!Array.from(this.fileSelect.options).some(opt => opt.value === fileName)) {
                    const option = document.createElement('option');
                    option.value = fileName;
                    option.textContent = fileName;
                    this.fileSelect.appendChild(option);
                }

                if (selectAfter || !this.fileSelect.value) {
                    this.fileSelect.value = fileName;
                    this.setContent(content);
                    this.updateSplitView();
                }

                this.persistTranscripts();
            }

            saveTranscripts() {
                const data = Array.from(this.files.entries()).map(([name, content]) => ({ name, content }));

                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'transcripts.json';
                a.click();
                URL.revokeObjectURL(url);

                this.showStatus('Transcripts saved to transcripts.json');
            }

            loadTranscriptsFile(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        this.files.clear();
                        this.fileSelect.innerHTML = '<option value="">Select transcript or upload...</option>';

                        data.forEach(({ name, content }) => {
                            this.addTranscript(name, content, false);
                        });

                        this.showStatus(`Loaded ${data.length} transcripts`);
                        this.persistTranscripts();
                    } catch (error) {
                        console.error('Error loading transcripts:', error);
                        this.showStatus('Error loading transcripts file');
                    }
                };
                reader.readAsText(file);
            }

            togglePlay() {
                this.isPlaying = !this.isPlaying;
                this.updatePlayButtons();

                if (this.isPlaying) {
                    this.startScroll();
                } else {
                    this.stopScroll();
                }
            }

            updatePlayButtons() {
                const playBtn = document.getElementById('playBtn');
                const label = this.isPlaying ? 'Pause' : 'Play';
                playBtn.textContent = label;
                this.collapsedPlayBtn.textContent = label;
            }

            startScroll() {
                const step = () => {
                    if (!this.isPlaying) return;
                    window.scrollBy(0, this.speed);
                    this.scrollRaf = requestAnimationFrame(step);
                };
                this.scrollRaf = requestAnimationFrame(step);
            }

            stopScroll() {
                if (this.scrollRaf) {
                    cancelAnimationFrame(this.scrollRaf);
                    this.scrollRaf = null;
                }
            }

            toggleMirror() {
                this.isMirrored = !this.isMirrored;
                this.content.classList.toggle('mirror', this.isMirrored);

                const mirrorContent = document.getElementById('content-mirror');
                if (mirrorContent) {
                    mirrorContent.classList.toggle('mirror', !this.isMirrored);
                }
            }

            toggleSplit() {
                this.isSplit = !this.isSplit;
                this.contentWrapper.classList.toggle('split-view', this.isSplit);
                this.updateSplitView();
            }

            updateSplitView() {
                const mirrorContent = document.getElementById('content-mirror');
                if (this.isSplit) {
                    if (!mirrorContent) {
                        const mirror = this.content.cloneNode(true);
                        mirror.id = 'content-mirror';
                        mirror.classList.add('mirror');
                        this.contentWrapper.appendChild(mirror);
                    } else {
                        mirrorContent.textContent = this.content.textContent;
                    }
                } else if (mirrorContent) {
                    mirrorContent.remove();
                }
            }

            adjustSpeed(delta) {
                this.speed = Math.max(0.1, Math.min(8, this.speed + delta));
                this.speedDisplay.textContent = `${this.speed.toFixed(1)}x`;
                if (this.isPlaying) {
                    this.stopScroll();
                    this.startScroll();
                }
            }

            setContent(text) {
                this.content.textContent = text;
                window.scrollTo({ top: 0 });
            }

            updateAppearance() {
                const fontSize = this.fontSizeControl.value;
                const lineHeight = this.lineHeightControl.value;
                const width = this.widthControl.value;

                document.getElementById('fontSizeValue').textContent = fontSize;
                document.getElementById('lineHeightValue').textContent = lineHeight;
                document.getElementById('widthValue').textContent = width;

                this.content.style.fontSize = `${fontSize}px`;
                this.content.style.lineHeight = lineHeight;
                this.content.style.maxWidth = `${width}px`;

                const mirrorContent = document.getElementById('content-mirror');
                if (mirrorContent) {
                    mirrorContent.style.fontSize = `${fontSize}px`;
                    mirrorContent.style.lineHeight = lineHeight;
                    mirrorContent.style.maxWidth = `${width}px`;
                }

                this.persistPreferences();
            }

            showStatus(message, duration = 3000) {
                this.status.textContent = message;
                this.status.classList.add('show');
                setTimeout(() => {
                    this.status.classList.remove('show');
                }, duration);
            }

            persistTranscripts() {
                const data = Array.from(this.files.entries()).map(([name, content]) => ({ name, content }));
                localStorage.setItem('teleprompter_transcripts', JSON.stringify(data));
            }

            loadSavedTranscripts() {
                try {
                    const saved = localStorage.getItem('teleprompter_transcripts');
                    if (!saved) return;
                    const data = JSON.parse(saved);
                    data.forEach(({ name, content }) => this.addTranscript(name, content, false));
                    this.showStatus(`Restored ${data.length} transcript(s)`);
                } catch (err) {
                    console.warn('No saved transcripts found', err);
                }
            }

            persistPreferences() {
                const prefs = {
                    fontSize: this.fontSizeControl.value,
                    lineHeight: this.lineHeightControl.value,
                    width: this.widthControl.value,
                    speed: this.speed
                };
                localStorage.setItem('teleprompter_prefs', JSON.stringify(prefs));
            }

            restorePreferences() {
                try {
                    const saved = localStorage.getItem('teleprompter_prefs');
                    if (!saved) return;
                    const prefs = JSON.parse(saved);
                    this.fontSizeControl.value = prefs.fontSize || this.fontSizeControl.value;
                    this.lineHeightControl.value = prefs.lineHeight || this.lineHeightControl.value;
                    this.widthControl.value = prefs.width || this.widthControl.value;
                    this.speed = prefs.speed || this.speed;
                    this.speedDisplay.textContent = `${this.speed.toFixed(1)}x`;
                    this.updateAppearance();
                } catch (err) {
                    console.warn('No saved preferences found', err);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new Teleprompter();
        });
    </script>
</body>
</html>
